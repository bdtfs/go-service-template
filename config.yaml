service:
  name: my-service
  type: api # api | consumer | worker

server:
  port: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s

log:
  level: ${LOG_LEVEL:info}
  format: json # json | text
  dest: stdout # stdout | stderr
  add_source: false

metrics:
  enabled: true
  address: ":8081"
  namespace: ${METRICS_NAMESPACE:my-service}
  subsystem: ${METRICS_SUBSYSTEM:app}

components:
  postgres:
    # The reference "operations" domain needs postgres. `make dc-reup` starts it.
    enabled: ${POSTGRES_ENABLED:true}
    dsn: ${PG_DSN:postgresql://postgres:password@localhost:5432/mydb?sslmode=disable}
    max_conns: 25
    min_conns: 5

app:
  notifier:
    base_url: ${NOTIFIER_BASE_URL:http://localhost:9000}
    timeout: 5s
  create_operation:
    max_reattempt: ${CREATE_OPERATION_MAX_REATTEMPT:5}
